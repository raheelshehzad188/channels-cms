server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zenvello.se www.zenvello.se;

    root /var/www/projects/zenvello.co.uk;
    index index.php index.html index.htm;

    access_log /var/log/nginx/zenvello.se.access.log;
    error_log  /var/log/nginx/zenvello.se.error.log;

    ssl_certificate /etc/letsencrypt/live/zenvello.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenvello.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(application|system|db|deploy)/ {
        deny all;
    }

    location ~* \.(sql|pem|md)$ {
        deny all;
    }

    location = /config.php {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 64M;
}

server {
    listen 80;
    listen [::]:80;
    server_name zenvello.se www.zenvello.se;
    return 301 https://$host$request_uri;
}
